name: Build ImageShrink

on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x scripts/*.sh
          ./scripts/build.sh 2>&1 | tee build.log

      - name: Self-test on real macOS
        id: test
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/selftest.sh 2>&1 | tee selftest.log

      - name: Publish release
        id: release
        if: github.ref == 'refs/heads/main' && steps.build.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          tag="v${ver}-build${{ github.run_number }}"
          grep -E "^(SUMMARY|PASS app)" selftest.log > notes.txt || true
          gh release create "$tag" dist/ImageShrink.zip \
            --title "ImageShrink $ver (build ${{ github.run_number }})" \
            --notes-file notes.txt

      - name: Report status to build-status branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          W="$GITHUB_WORKSPACE"
          mkdir -p /tmp/status && cd /tmp/status
          {
            echo "# Build ${{ github.run_number }} (${{ github.ref_name }})"
            echo "commit: ${{ github.sha }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "selftest: ${{ steps.test.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## build errors"
            grep -nE "error:|warning: unre|fatal" "$W/build.log" 2>/dev/null | head -80 || true
            echo
            echo "## build.log (last 120 lines)"
            tail -120 "$W/build.log" 2>/dev/null || true
            echo
            echo "## selftest.log"
            cat "$W/selftest.log" 2>/dev/null || true
          } > status.md
          git init -q -b build-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.md
          git commit -qm "Build ${{ github.run_number }}: build=${{ steps.build.outcome }} test=${{ steps.test.outcome }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-status
